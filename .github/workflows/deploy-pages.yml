name: Deploy to GitHub Pages

# Why this file exists at all
# ---------------------------------------------------------------------------
# The site is plain HTML/CSS/JS, so "deploy from a branch" would work for the
# markup. It cannot work for the one generated file: `assets/js/config.js`
# carries the Supabase project reference and publishable key and is deliberately
# gitignored, so no credential can be smuggled into public history by an
# accidental commit. A build step is what turns the repository into a working
# site — hence this workflow.
#
# The two values it needs are *repository variables* (not secrets): a publishable
# key is public by design, and Row Level Security in Postgres is what protects
# data. Keeping them as variables also means the deployed build can be inspected
# and re-run without anyone pasting a key into a chat.
#
# Setup (Settings → Secrets and variables → Actions → New repository variable):
#   SUPABASE_URL          https://<reference>.supabase.co
#   SUPABASE_ANON_KEY     sb_publishable_…   (the publishable key)
#   PUBLIC_SITE_URL       https://<owner>.github.io/Muna-havens/   (optional)
#   MUNA_REALTIME         1 to live-update the catalogue while the dashboard is
#                         open; leave unset for the conservative default.
#
# Then set Pages → Build source → "GitHub Actions". If the source stays on a
# branch, the deployed site will run in its labelled preview mode, because the
# generated file will not exist there.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check, build and assemble the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      MUNA_REALTIME: ${{ vars.MUNA_REALTIME }}
    steps:
      - uses: actions/checkout@v4

      # No dependencies are installed on purpose: this project has none, so the
      # build cannot be broken by a registry outage or a supply-chain change.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Guard rails (brand rules, secret scan, migration safety)
        run: node scripts/check.mjs

      - name: Tests
        run: node --test tests/*.test.mjs

      - name: Generate configuration and assemble the deployable folder
        run: node scripts/build.mjs --site

      - name: Refuse to publish a credential that slipped into the output
        run: |
          set -e
          if grep -REq 'sb_secret_|-----BEGIN [A-Z ]*PRIVATE KEY|service_role' _site --include='*.js' --include='*.html' --include='*.json'; then
            echo '::error::A privileged credential appears in _site/. Fix the inputs; do not deploy.'
            exit 1
          fi
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY are not set as repository variables, so the deployed site will show its labelled preview catalogue instead of the real one."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
