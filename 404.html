<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Muna’s Haven</title>
    <meta name="robots" content="noindex" />
    <script>
      /*
       * GitHub Pages returns this document for any path it cannot find.
       * Canonical links for this site are hash routes (#/product/MH-JEW-002),
       * which never reach a 404 — but a hand-typed or auto-corrected clean path
       * such as /Muna-havens/product/MH-JEW-001 does. Rather than dead-ending,
       * rewrite it onto the equivalent hash route so the page still loads.
       * No history API, no server rewrites, nothing to break on refresh.
       */
      (function () {
        var here = location.pathname;
        var root = here.replace(/404\.html$/, '').replace(/\/[^/]*$/, '/');
        if (root.indexOf('/owner') > -1) {
          location.replace(root.replace(/owner\/?$/, 'owner/') + '#/not-found');
          return;
        }
        var tail = location.pathname.replace(root, '').replace(/^\/|\/$/g, '');
        var target = root + (location.search || '') + (tail ? '#/' + tail : '#/');
        location.replace(target);
      })();
    </script>
    <noscript>
      <p style="font-family: Georgia, serif; padding: 2rem; color: #382724">
        That page is not part of the Muna’s Haven catalogue.
        <a href="./" style="color: #c8838c">Return to the store</a>.
      </p>
    </noscript>
  </head>
  <body></body>
</html>
